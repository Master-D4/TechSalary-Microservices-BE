name: Identity Service Pipeline

# ONLY run this if the Identity code changes!
on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/identity-service/**'
      - 'k8s/app-namespace/02-identity.yaml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # Bypasses Apple Silicon limits!

    steps:
    # 1. Download the code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Login to private Azure Container Registry
    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: techsalaryacrd4.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    # 3. Build the Image and Push to Azure
    - name: Build and Push Docker Image
      run: |
        docker build -t techsalaryacrd4.azurecr.io/techsalary-identity:latest ./src/identity-service
        docker push techsalaryacrd4.azurecr.io/techsalary-identity:latest

    # 4. Connect to Azure Kubernetes Cluster
    - name: Set up Kubernetes Context
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG }}

    # 5. Apply the rules and restart the Pod
    - name: Deploy to Azure Kubernetes Service
      run: |
        kubectl apply -f k8s/app-namespace/02-identity.yaml
        kubectl rollout restart deployment techsalary-identity -n app