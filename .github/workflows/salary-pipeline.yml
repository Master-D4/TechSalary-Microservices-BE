name: Salary Service Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/salary-service/**'
      - 'k8s/app-namespace/07-salary.yaml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: techsalaryacrd4.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and Push Docker Image
      run: |
        docker build -t techsalaryacrd4.azurecr.io/techsalary-salary:latest ./src/salary-service
        docker push techsalaryacrd4.azurecr.io/techsalary-salary:latest

    - name: Set up Kubernetes Context
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG }}

    - name: Deploy to Azure Kubernetes Service
      run: |
        kubectl apply -f k8s/app-namespace/07-salary.yaml
        kubectl apply -f k8s/ingress/ingress.yaml
        kubectl rollout restart deployment techsalary-salary -n app