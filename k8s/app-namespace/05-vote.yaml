apiVersion: apps/v1
kind: Deployment
metadata:
  name: techsalary-vote
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
        - name: vote
          image: techsalaryacrd4.azurecr.io/techsalary-vote:latest
          ports:
            - containerPort: 8005
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 5
            periodSeconds: 10
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets

---
apiVersion: v1
kind: Service
metadata:
  name: techsalary-vote
  namespace: app
spec:
  selector:
    app: vote
  ports:
    - port: 8005
      targetPort: 8005