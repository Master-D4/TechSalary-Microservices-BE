# This pipeline ONLY watches the identity-service folder!
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - src/identity-service/*
      - k8s/app-namespace/02-identity.yaml

pool:
  vmImage: 'ubuntu-latest' # Bypasses Apple Silicon architecture limits!

variables:
  dockerRegistryServiceConnection: 'ACR-Connection'
  kubernetesServiceConnection: 'AKS-Connection'
  imageRepository: 'techsalary-identity'

stages:
- stage: BuildAndDeploy
  displayName: 'Deploy Identity Service'
  jobs:
  - job: Deploy
    steps:
    # 1. Build and Push
    - task: Docker@2
      displayName: 'Build & Push Identity Image'
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: 'src/identity-service/Dockerfile'
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: 'latest'

    # 2. Update Kubernetes
    - task: KubernetesManifest@1
      displayName: 'Apply Kubernetes YAML'
      inputs:
        action: 'deploy'
        connectionType: 'kubernetesServiceConnection'
        kubernetesServiceConnection: $(kubernetesServiceConnection)
        namespace: 'app'
        manifests: 'k8s/app-namespace/02-identity.yaml'

    # 3. Restart ONLY the Identity Pod
    - task: Kubernetes@1
      displayName: 'Restart Identity Pod'
      inputs:
        connectionType: 'Kubernetes Service Connection'
        kubernetesServiceEndpoint: $(kubernetesServiceConnection)
        namespace: 'app'
        command: 'rollout'
        arguments: 'restart deployment techsalary-identity'