version: '3.8'

services:
  # 1. The Database
  postgres-db:
    image: postgres:15-alpine
    container_name: techsalary-postgres
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: techsalary_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Run the SQL file on startup:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d techsalary_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Identity Service
  identity-service:
    build:
      context: ./src/identity-service
      dockerfile: Dockerfile
    container_name: techsalary-identity
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://myuser:mypassword@postgres-db:5432/techsalary_db
      - SECRET_KEY=super_secret_key_for_dev_only
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    depends_on:
      postgres-db:
        condition: service_healthy

  # 3. Salary Service
  salary-service:
    build:
      context: ./src/salary-service
      dockerfile: Dockerfile
    container_name: techsalary-salary
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgresql://myuser:mypassword@postgres-db:5432/techsalary_db
    depends_on:
      postgres-db:
        condition: service_healthy

  # 4. Search Service
  search-service:
    build:
      context: ./src/search-service
      dockerfile: Dockerfile
    container_name: techsalary-search
    ports:
      - "8004:8004"
    environment:
      - DATABASE_URL=postgresql://myuser:mypassword@postgres-db:5432/techsalary_db
    depends_on:
      postgres-db:
        condition: service_healthy

  # 5. Vote Service
  vote-service:
    build:
      context: ./src/vote-service
      dockerfile: Dockerfile
    container_name: techsalary-vote
    ports:
      - "8005:8005"
    environment:
      - DATABASE_URL=postgresql://myuser:mypassword@postgres-db:5432/techsalary_db
    depends_on:
      postgres-db:
        condition: service_healthy

  # 6. Stats Service
  stats-service:
    build:
      context: ./src/stats-service
      dockerfile: Dockerfile
    container_name: techsalary-stats
    ports:
      - "8006:8006"
    environment:
      - DATABASE_URL=postgresql://myuser:mypassword@postgres-db:5432/techsalary_db
    depends_on:
      postgres-db:
        condition: service_healthy

  # 7. BFF Service (Gateway)
  bff-service:
    build:
      context: ./src/bff-service
      dockerfile: Dockerfile
    container_name: techsalary-bff
    ports:
      - "8000:8000"
    environment:
      - IDENTITY_SERVICE_URL=http://identity-service:8001/api/v1
      - SALARY_SERVICE_URL=http://salary-service:8003/api/v1/salary
      - SEARCH_SERVICE_URL=http://search-service:8004/api/v1
      - VOTE_SERVICE_URL=http://vote-service:8005/vote
      - STAT_SERVICE_URL=http://stats-service:8006/api/v1
    depends_on:
      - identity-service
      - salary-service
      - search-service
      - vote-service
      - stats-service

volumes:
  postgres_data: